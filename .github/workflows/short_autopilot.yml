name: Last Map Standing — Daily Shorts + FB Reels Autopilot (2x/day US Peak)

on:
  # schedule: disabled (triggered on-time via cron-job.org workflow_dispatch)
    # 2x/day US Prime-Time Peak (YouTube Shorts + Facebook Reels together):
    #   16:19 UTC = 11:19 AM EST / 8:19 AM PST (US Lunch + West Coast Morning)
    #   21:19 UTC =  4:19 PM EST / 1:19 PM PST (US After-Work / Evening Peak)
    # - cron: '19 16,21 * * *'
  workflow_dispatch:
    inputs:
      scenario_id:
        description: 'Optional specific scenario_id (leave blank for auto-next)'
        required: false
        default: ''
      privacy:
        description: 'YouTube privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write

jobs:
  publish_short:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Generate & Publish Saul Bass Map Short + FB Reel
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.scenario_id }}" ]; then
            EXTRA="--scenario-id ${{ github.event.inputs.scenario_id }}"
          fi
          PRIV="${{ github.event.inputs.privacy }}"
          [ -z "$PRIV" ] && PRIV="public"
          python3 run_daily_v22.py --mode short --privacy "$PRIV" $EXTRA

      - name: Commit published_history.json (keeps 5+ year cron alive forever!)
        run: |
          git config user.name "LastMapStanding Bot"
          git config user.email "bot@lastmapstanding.local"
          git pull --rebase origin main || true
          git add published_history.json
          git diff --staged --quiet || git commit -m "chore: log published Short [skip ci]"
          git push
