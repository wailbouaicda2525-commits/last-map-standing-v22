name: Last Map Standing — Facebook Photo Carousels & Debate Posts (2x/day US Peak)

on:
  # schedule: disabled (triggered on-time via cron-job.org workflow_dispatch)
    # US Peak Facebook Monetization Engagement Hours ($0/mo Direct Graph API):
    #   14:23 UTC = 9:23 AM EST / 6:23 AM PST -> 3-Slide Saul Bass Photo Carousel
    #   22:41 UTC = 5:41 PM EST / 2:41 PM PST -> High-Debate US Text Discussion Post
    # - cron: '23 14 * * *'
    # - cron: '41 22 * * *'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Choose Facebook post format to run now'
        required: false
        default: 'fb_carousel'
        type: choice
        options:
          - fb_carousel
          - fb_text
      scenario_id:
        description: 'Optional specific scenario_id (leave blank for auto-next)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish_facebook_engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Generate & Publish Facebook Photo Carousel or Text Debate Post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.post_type }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "41 22 * * *" ]; then
              MODE="fb_text"
            else
              MODE="fb_carousel"
            fi
          fi
          EXTRA=""
          if [ -n "${{ github.event.inputs.scenario_id }}" ]; then
            EXTRA="--scenario-id ${{ github.event.inputs.scenario_id }}"
          fi
          echo "Running Facebook Direct Graph API mode=$MODE"
          python3 run_daily_v22.py --mode "$MODE" $EXTRA

      - name: Commit published_history.json (zero-repeat forever!)
        run: |
          git config user.name "LastMapStanding Bot"
          git config user.email "bot@lastmapstanding.local"
          git add published_history.json
          git diff --staged --quiet || git commit -m "chore: log published FB engagement post [skip ci]"
          git push
